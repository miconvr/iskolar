<!doctype html>
<html lang="en">
<head>
  <title>Iskolar</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand-row">
      <div class="brand-mark">
        <img src="icons/icon48.png" alt="">
      </div>
      <div>
        <p class="eyebrow">Student perks, checked</p>
        <h1>Iskolar</h1>
      </div>
    </div>
    <p id="site" class="site-line"></p>
  </header>

  <section id="matches" aria-live="polite"></section>

  <details id="browse">
    <summary><span>Browse all perks</span><span class="summary-count" aria-hidden="true"></span></summary>
    <label class="search-label" for="search">Find a perk</label>
    <input id="search" type="search" placeholder="Search by name or category" aria-label="Search perks">
    <ul id="all"></ul>
  </details>

  <footer><span class="footer-lock" aria-hidden="true">Local first</span> Offers are matched on your device. Confirm eligibility on the official page.</footer>
  <script src="offers-loader.js"></script><script src="popup.js"></script>
</body>
</html>
