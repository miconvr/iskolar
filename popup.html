<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <title>Iskolar</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand-row">
      <div class="brand-mark">
        <img src="icons/logo.png" alt="">
      </div>
      <div>
        <h1>Iskolar</h1>
      </div>
      <button id="settings-btn" class="settings-btn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings-panel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h2.6M11.4 8H20M4 16h8.6M17.4 16H20"/><circle cx="9" cy="8" r="2.4"/><circle cx="15" cy="16" r="2.4"/></svg></button>
    </div>
        <div id="settings-panel" class="settings-panel" hidden>
      <button id="theme-toggle" class="theme-toggle settings-item" type="button" aria-label="Enable dark mode" aria-pressed="false">
        <span class="theme-label">Dark mode</span>
        <span class="theme-switch" aria-hidden="true"><span></span></span>
      </button>
      <button id="footer-toggle" class="theme-toggle settings-item" type="button" aria-pressed="false"><span class="theme-label">Hide footer</span><span class="theme-switch" aria-hidden="true"><span></span></span></button>
    </div>
    <p id="site" class="site-line"></p>
  </header>

  <section id="matches" aria-live="polite"></section>

  <details id="browse">
    <summary><span>Browse student deals</span><span class="summary-count" aria-hidden="true"></span></summary>
    <label class="search-label" for="search">Find student deals</label>
    <input id="search" type="search" placeholder="Search student deals" aria-label="Search student deals">
    <ul id="all"></ul>
  </details>

  <footer>
    <div class="footer-divider" aria-hidden="true"></div>
    <div class="rate-stars" role="group" aria-label="Rate Iskolar on the Chrome Web Store">
      <a class="star" href="https://chromewebstore.google.com/detail/ghmgacjeikbkciknkcldfkpiiclfaeik" target="_blank" rel="noopener noreferrer" aria-label="Rate 5 stars" title="5 stars">&#9733;</a>
      <a class="star" href="https://chromewebstore.google.com/detail/ghmgacjeikbkciknkcldfkpiiclfaeik" target="_blank" rel="noopener noreferrer" aria-label="Rate 4 stars" title="4 stars">&#9733;</a>
      <a class="star" href="https://chromewebstore.google.com/detail/ghmgacjeikbkciknkcldfkpiiclfaeik" target="_blank" rel="noopener noreferrer" aria-label="Rate 3 stars" title="3 stars">&#9733;</a>
      <a class="star" href="https://chromewebstore.google.com/detail/ghmgacjeikbkciknkcldfkpiiclfaeik" target="_blank" rel="noopener noreferrer" aria-label="Rate 2 stars" title="2 stars">&#9733;</a>
      <a class="star" href="https://chromewebstore.google.com/detail/ghmgacjeikbkciknkcldfkpiiclfaeik" target="_blank" rel="noopener noreferrer" aria-label="Rate 1 star" title="1 star">&#9733;</a>
    </div>
    <p class="tip-row"><a class="tip-btn" href="https://www.paypal.com/paypalme/miconvr" target="_blank" rel="noopener noreferrer" aria-label="Send a tip to the developer through PayPal" title="Opens PayPal. Pay what you like.">Send a tip via PayPal</a></p>
    <p class="footer-credit">Made with <span class="footer-heart" aria-hidden="true">&#9829;</span> by <a class="credit-author" href="https://github.com/miconvr" target="_blank" rel="noopener noreferrer">Mico Gerard Navarro</a></p>
    <nav class="footer-links" aria-label="Iskolar links">
      <a href="https://github.com/miconvr/iskolar" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://github.com/miconvr/iskolar/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer">Privacy</a>
      <a href="https://github.com/miconvr/iskolar/issues" target="_blank" rel="noopener noreferrer">Report</a>
    </nav>
    <p class="footer-note">Offers are matched on your device, so your browsing stays private.</p>
  </footer>
  <script src="offers-loader.js"></script><script src="popup.js"></script>
</body>
</html>
