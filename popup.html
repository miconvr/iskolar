<!doctype html>
<html lang="en">
<head>
  <title>Iskolar</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand-row">
      <div class="brand-mark">
        <img src="icons/logo.svg" alt="">
      </div>
      <div>
        <h1>Iskolar</h1>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Enable dark mode" aria-pressed="false">
        <span class="theme-label">Dark mode</span>
        <span class="theme-switch" aria-hidden="true"><span></span></span>
      </button>
    </div>
    <p id="site" class="site-line"></p>
  </header>

  <section id="matches" aria-live="polite"></section>

  <details id="browse">
    <summary><span>Browse student deals</span><span class="summary-count" aria-hidden="true"></span></summary>
    <label class="search-label" for="search">Find a perk</label>
    <input id="search" type="search" placeholder="Search by name or category" aria-label="Search perks">
    <ul id="all"></ul>
  </details>

  <footer>
    <p><span class="footer-lock">Local first</span> Offers are matched on your device.</p>
    <p class="footer-credit">Built with care <span class="footer-heart" aria-hidden="true">&#9829;</span> by Mico Gerard Navarro</p>
    <nav class="footer-links" aria-label="Iskolar links">
      <a href="https://github.com/miconvr/iskolar" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://github.com/miconvr/iskolar/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer">Privacy</a>
      <a href="https://github.com/miconvr/iskolar/issues" target="_blank" rel="noopener noreferrer">Report</a>
      <a class="support-link" href="https://www.paypal.com/paypalme/miconvr" target="_blank" rel="noopener noreferrer">Support</a>
    </nav>
  </footer>
  <script src="offers-loader.js"></script><script src="popup.js"></script>
</body>
</html>
